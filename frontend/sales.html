<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sales & Billing · TrackNStock</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/components.css"></head>
<body data-page="sales"><div id="app-shell"><aside id="sidebar"></aside><div class="workspace"><header id="topbar"></header><main class="page-content"><div class="page-heading"><div><p class="eyebrow">CHECKOUT</p><h1>Sales &amp; billing</h1><p class="muted">Build a cart and complete a sample sale.</p></div></div><div class="sales-layout"><section class="panel"><div class="panel-heading"><div><h2>Choose products</h2><p class="muted">Add items to this transaction</p></div></div><label class="search-box sales-search">⌕ <input id="sales-search" placeholder="Search available products..."></label><div id="sales-products" class="product-picker"></div></section><section class="panel cart-panel"><div class="panel-heading"><div><h2>Current sale</h2><p class="muted" id="cart-count">No items added</p></div><button id="clear-cart" class="text-button">Clear cart</button></div><div id="cart-items"></div><div class="cart-summary"><div><span>Subtotal</span><strong id="cart-subtotal">₱0.00</strong></div><div class="cash-field"><label for="cash-received">Cash received</label><input id="cash-received" type="number" min="0" step="0.01" placeholder="0.00"></div><div><span>Change</span><strong id="cash-change">₱0.00</strong></div><button id="complete-sale" class="button primary full">Complete sale</button></div></section></div></main></div></div><script src="js/data.js"></script><script src="js/storage.js"></script><script src="js/app.js"></script><script src="js/sales.js"></script></body></html>
