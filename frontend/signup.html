<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up · TrackNStock</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
</head>

<body class="login-page">

    <main class="login-card">
        <a class="brand" href="index.html">
            <span class="brand-mark">T</span>
            <span>TrackNStock
                <small>SUPPLY INVENTORY</small>
            </span>
        </a>

        <p class="eyebrow">CREATE AN ACCOUNT</p>
        <h1>Sign up for TrackNStock</h1>
        <p class="muted">Enter your details to request an account.</p>

        <form id="signup-form" class="stack-form">

            <label>Full Name
                <input type="text" name="fullName" required maxlength="100"
                       placeholder="Enter your full name">
            </label>

            <label>Username
                <input type="text" name="username" required minlength="3"
                       maxlength="40" placeholder="Choose a username">
            </label>

            <label>Email Address
                <input type="email" name="email" required maxlength="254"
                       placeholder="Enter your email">
            </label>

            <label>Contact Number
                <input type="tel" name="phone" required maxlength="30"
                       placeholder="Enter your contact number">
            </label>

            <label>Password
                <input type="password" name="password" required minlength="8"
                       autocomplete="new-password"
                       placeholder="Create a password">
            </label>

            <label>Confirm Password
                <input type="password" name="confirmPassword" required minlength="8"
                       autocomplete="new-password"
                       placeholder="Confirm your password">
            </label>

            <button type="submit" class="button primary full">
                Sign Up →
            </button>

            <p id="signup-error" class="error-text" role="alert"></p>
            <p id="signup-success" class="success-text" role="status"></p>
        </form>

        <p class="login-foot">
            Already have an account?
            <a href="login.html">Log In</a>
        </p>

        <p class="login-foot">
            <a href="index.html">← Back to Home</a>
        </p>
    </main>

</body>
</html>
