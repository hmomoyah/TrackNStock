<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stock In · TrackNStock</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/components.css"></head>
<body data-page="stock-in"><div id="app-shell"><aside id="sidebar"></aside><div class="workspace"><header id="topbar"></header><main class="page-content"><div class="page-heading"><div><p class="eyebrow">INVENTORY MOVEMENT</p><h1>Stock In</h1><p class="muted">Record deliveries and update available stock.</p></div></div><section class="panel form-panel"><form id="stock-in-form" class="form-grid"><label>Product *<select name="productId" required></select></label><label>Quantity *<input name="quantity" type="number" min="1" step="1" required></label><label>Date *<input name="date" type="date" required></label><label>Supplier<select name="supplierId"></select></label><label>Reference number<input name="reference" placeholder="e.g. PO-2026-014"></label><label>Notes<input name="notes" placeholder="Optional notes"></label><div class="span-2 form-actions"><button class="button primary" type="submit">Record stock in</button></div></form></section><section class="panel"><div class="panel-heading"><div><h2>Recent stock movements</h2><p class="muted">Latest recorded changes</p></div></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Product</th><th>Movement</th><th>Quantity</th><th>Reference / reason</th></tr></thead><tbody id="stock-history"></tbody></table></div></section></main></div></div><script src="js/data.js"></script><script src="js/storage.js"></script><script src="js/app.js"></script><script src="js/inventory.js"></script></body></html>
