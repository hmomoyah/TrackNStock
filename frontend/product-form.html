<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product form · TrackNStock</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/components.css"></head>
<body data-page="product-form"><div id="app-shell"><aside id="sidebar"></aside><div class="workspace"><header id="topbar"></header><main class="page-content narrow-content"><div class="breadcrumb"><a href="products.html">Products</a><span>›</span> <span id="form-breadcrumb">Add product</span></div><div class="page-heading"><div><p class="eyebrow">INVENTORY</p><h1 id="form-title">Add product</h1><p class="muted">Enter the product details below.</p></div></div><form id="product-form" class="panel form-grid"><label class="span-2">Product name *<input name="name" required maxlength="100" placeholder="e.g. Classic ruled notebook"></label><label>Category *<select name="categoryId" required></select></label><label>Supplier<select name="supplierId"></select></label><label>Unit price (₱) *<input name="price" type="number" min="0.01" step="0.01" required></label><label>Stock quantity *<input name="stock" type="number" min="0" step="1" required></label><label>Minimum stock level *<input name="minStock" type="number" min="0" step="1" required></label><label class="span-2">Description<textarea name="description" rows="3" placeholder="Optional product details"></textarea></label><div class="form-actions span-2"><a class="button secondary" href="products.html">Cancel</a><button class="button primary" type="submit">Save product</button></div></form></main></div></div><script src="js/data.js"></script><script src="js/storage.js"></script><script src="js/app.js"></script><script src="js/products.js"></script></body></html>
