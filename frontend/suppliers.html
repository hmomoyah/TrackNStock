<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suppliers · TrackNStock</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/components.css"></head>
<body data-page="suppliers"><div id="app-shell"><aside id="sidebar"></aside><div class="workspace"><header id="topbar"></header><main class="page-content"><div class="page-heading"><div><p class="eyebrow">PARTNERS</p><h1>Suppliers</h1><p class="muted">Keep supplier contacts in one convenient place.</p></div><button class="button primary" id="add-supplier">＋ Add supplier</button></div><section class="panel"><div class="toolbar"><label class="search-box">⌕ <input id="supplier-search" placeholder="Search suppliers..."></label></div><div class="table-wrap"><table><thead><tr><th>Supplier</th><th>Contact person</th><th>Phone</th><th>Email</th><th>Address</th><th></th></tr></thead><tbody id="suppliers-table"></tbody></table></div></section></main></div></div>
<div class="modal-backdrop supplier-modal-backdrop" id="supplier-modal" hidden><section class="supplier-modal" role="dialog" aria-modal="true" aria-labelledby="supplier-modal-title"><header class="user-modal-header"><div><h2 id="supplier-modal-title">Add supplier</h2><p id="supplier-modal-description">Enter the supplier details.</p></div><button type="button" class="modal-close" id="close-supplier-modal" aria-label="Close dialog">×</button></header><form id="supplier-form" novalidate><div class="supplier-form-fields"><label>Supplier name<input id="supplier-name" name="name" required autocomplete="organization"></label><label>Contact person<input id="supplier-contact" name="contact" autocomplete="name"></label><label>Phone number<input id="supplier-phone" name="phone" type="tel" autocomplete="tel"></label><label>Email address<input id="supplier-email" name="email" type="email" autocomplete="email"></label><label>Address<textarea id="supplier-address" name="address" rows="3" autocomplete="street-address"></textarea></label></div><p class="form-error" id="supplier-form-error" role="alert" aria-live="polite"></p><div class="user-modal-actions"><button type="button" class="button secondary" id="cancel-supplier">Cancel</button><button type="submit" class="button primary" id="save-supplier">Save supplier</button></div></form></section></div>
<script src="js/data.js"></script><script src="js/storage.js"></script><script src="js/app.js"></script><script src="js/suppliers.js"></script></body></html>
