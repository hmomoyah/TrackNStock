<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Categories · TrackNStock</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/components.css"></head>
<body data-page="categories"><div id="app-shell"><aside id="sidebar"></aside><div class="workspace"><header id="topbar"></header><main class="page-content"><div class="page-heading"><div><p class="eyebrow">CATALOG</p><h1>Categories</h1><p class="muted">Organize supplies into clear product groups.</p></div><button class="button primary" id="add-category">＋ Add category</button></div><section class="panel"><div class="toolbar"><label class="search-box"><span aria-hidden="true">⌕</span><input id="category-search" type="search" placeholder="Search categories..."></label></div><div class="table-wrap"><table><thead><tr><th>Category</th><th>Description</th><th>Products</th><th></th></tr></thead><tbody id="categories-table"></tbody></table></div></section></main></div></div>
<div class="modal-backdrop category-modal-backdrop" id="category-modal" hidden><section class="category-modal" role="dialog" aria-modal="true" aria-labelledby="category-modal-title"><header class="user-modal-header"><div><h2 id="category-modal-title">Add category</h2><p id="category-modal-description">Enter the category details.</p></div><button type="button" class="modal-close" id="close-category-modal" aria-label="Close dialog">×</button></header><form id="category-form" novalidate><div class="category-form-fields"><label>Category name<input id="category-name" name="name" required autocomplete="off"></label><label>Description<textarea id="category-description" name="description" rows="3"></textarea></label></div><p class="form-error" id="category-form-error" role="alert" aria-live="polite"></p><div class="user-modal-actions"><button type="button" class="button secondary" id="cancel-category">Cancel</button><button type="submit" class="button primary" id="save-category">Save category</button></div></form></section></div>
<script src="js/data.js"></script><script src="js/storage.js"></script><script src="js/app.js"></script><script src="js/categories.js"></script></body></html>
