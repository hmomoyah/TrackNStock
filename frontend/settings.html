<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings · TrackNStock</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/components.css"></head>
<body data-page="settings"><div id="app-shell"><aside id="sidebar"></aside><div class="workspace"><header id="topbar"></header><main class="page-content narrow-content"><div class="page-heading"><div><p class="eyebrow">PREFERENCES</p><h1>Settings</h1><p class="muted">Customize your store and demo profile.</p></div></div><form id="settings-form" class="panel form-grid"><h2 class="span-2">Store information</h2><label>Store name<input name="storeName" required></label><label>Contact information<input name="contact" placeholder="Phone or email"></label><label>Currency<select name="currency"><option value="PHP">PHP · Philippine peso (₱)</option></select></label><label>Default minimum stock<input name="minStock" type="number" min="0" step="1" required></label><h2 class="span-2" id="profile">My Profile</h2><label>Display name<input name="displayName" required></label><label>Signed in as<input name="username" readonly></label><label>Role<input name="role" readonly></label><div class="form-actions span-2"><button class="button primary" type="submit">Save settings</button><button class="button secondary" id="reset-demo" type="button">Reset demo data</button></div></form></main></div></div><script src="js/data.js"></script><script src="js/storage.js"></script><script src="js/app.js"></script></body></html>
